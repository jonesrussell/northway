<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A lightweight personal news reader powered by Northway.">
    <title>Northway feeds</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="masthead">
        <h1>Northway feeds</h1>
        <div class="live-state"><span class="live-dot" aria-hidden="true"></span> Connected</div>
      </header>

      <main>
        <section class="reader" aria-labelledby="briefing-heading">
          <div class="feed-bar">
            <div class="feed-tabs" role="tablist" aria-label="News feed">
              <button class="feed-tab is-active" type="button" role="tab" aria-selected="true" data-feed="mixed">Mixed</button>
              <button class="feed-tab" type="button" role="tab" aria-selected="false" data-feed="development">Development</button>
              <button class="feed-tab" type="button" role="tab" aria-selected="false" data-feed="entertainment">Entertainment</button>
              <button class="feed-tab" type="button" role="tab" aria-selected="false" data-feed="canada">Canada</button>
              <button class="feed-tab" type="button" role="tab" aria-selected="false" data-feed="world">World</button>
            </div>
            <button class="refresh" type="button" id="refresh-button">
              <span aria-hidden="true">↻</span> Refresh
            </button>
          </div>

          <div class="briefing-head">
            <div>
              <p class="section-label">Feed</p>
              <h2 id="briefing-heading">Mixed</h2>
            </div>
            <div class="briefing-meta" id="briefing-meta" aria-live="polite">Retrieving your news…</div>
          </div>

          <div class="status-card" id="status-card" role="status">
            <span class="loader" aria-hidden="true"></span>
            <span id="status-text">Asking Northway for a fresh snapshot…</span>
          </div>

          <ol class="story-list" id="story-list" aria-live="polite" aria-busy="true"></ol>

          <aside class="coverage" id="coverage" hidden>
            <div>
              <p class="section-label">Coverage note</p>
              <p id="coverage-text"></p>
            </div>
            <span class="coverage-status" id="coverage-status"></span>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
