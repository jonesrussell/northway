version: '2'
sql:
  - engine: sqlite
    schema:
      - db/migrations/00001_corpus.sql
      - db/migrations/00003_api_keys.sql
      - db/migrations/00004_query_work.sql
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/sqlite/sqlc
        sql_package: database/sql
        emit_empty_slices: true
