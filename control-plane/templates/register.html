<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your invitation | NorthCloud</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body><main class="narrow"><a class="brand" href="/">NorthCloud</a><h1>Your workspace starts here.</h1><p>NorthCloud is an invitation beta. Your invitation contact will verify and activate your account after you register.</p><form id="register"><label for="name">Name</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="100" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><label for="invite">Invitation token</label><input id="invite" name="invite" autocomplete="off" spellcheck="false" required><button>Request account</button></form><p id="message" class="status" role="status"></p><p><a href="/login">Already activated? Sign in.</a></p></main></body></html>
