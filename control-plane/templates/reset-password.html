<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recover access | NorthCloud</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body><main class="narrow"><a class="brand" href="/">NorthCloud</a><h1>Recover your account.</h1><p>Ask your invitation contact to verify your identity and issue a short-lived recovery token. Never send them your password.</p><form id="reset"><label for="token">Recovery token</label><input id="token" name="token" autocomplete="off" spellcheck="false" required><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required><button>Reset password</button></form><p id="message" class="status" role="status"></p><a href="/login">Sign in</a></main></body></html>
