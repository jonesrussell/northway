server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /app.css { try_files $uri =404; }
    location = /app.js { try_files $uri =404; }
    location ~ \.php$ { return 404; }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        # Only the dedicated trusted host ingress can reach this loopback origin;
        # it overwrites X-Real-IP. Browser forwarding headers are never authority.
        fastcgi_param REMOTE_ADDR $http_x_real_ip;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 30s;
    }
}
